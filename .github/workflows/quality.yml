name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Python API and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      FISCALE_DATABASE_URL: sqlite:///${{ runner.temp }}/fiscale-lijn-ci.db
      FISCALE_APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify migrations on an empty database
        run: alembic upgrade head
      - name: Detect model and migration drift
        run: alembic check
      - name: Run API tests
        run: pytest

  frontend:
    name: Frontend typecheck and static build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build static frontend
        env:
          GITHUB_ACTIONS: true
        run: npm run build
